<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>密码功能完整测试</title>
    <script src="https://cdn.jsdelivr.net/npm/jsencrypt@3.3.2/bin/jsencrypt.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #log { background: #f5f5f5; padding: 15px; border-radius: 5px; white-space: pre-wrap; font-family: monospace; font-size: 13px; max-height: 500px; overflow-y: auto; }
        h2 { color: #333; }
    </style>
</head>
<body>
    <h2>🔐 密码功能完整测试</h2>
    <div id="log"></div>

    <script>
        const log = document.getElementById('log');
        const API_BASE = 'http://localhost:8100/de2api';
        let adminToken = '';

        function addLog(msg) {
            log.textContent += msg + '\n';
            console.log(msg);
        }

        // 获取公钥
        async function getPublicKey() {
            addLog('1️⃣ 获取RSA公钥...');
            const res = await fetch(`${API_BASE}/dekey`);
            const data = await res.json();
            if (data.code === 0) {
                addLog('   ✅ 公钥获取成功');
                return data.data;
            }
            throw new Error('获取公钥失败');
        }

        // RSA加密
        function encrypt(text, key) {
            const rsa = new JSEncrypt();
            rsa.setPublicKey(key);
            return rsa.encrypt(text);
        }

        // Admin登录
        async function adminLogin() {
            addLog('\n2️⃣ Admin登录...');
            try {
                const publicKey = await getPublicKey();
                const encryptedName = encrypt('admin', publicKey);
                const encryptedPwd = encrypt('DataEase@123456', publicKey);

                const res = await fetch(`${API_BASE}/login/localLogin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: encryptedName, pwd: encryptedPwd })
                });

                const data = await res.json();
                if (data.code === 0) {
                    adminToken = data.data;
                    addLog('   ✅ Admin登录成功');
                    addLog('   Token: ' + adminToken.substring(0, 60) + '...');
                    return true;
                }
                addLog('   ❌ 登录失败: ' + JSON.stringify(data));
                return false;
            } catch (error) {
                addLog('   ❌ 错误: ' + error.message);
                return false;
            }
        }

        // 创建用户（带自定义密码）
        async function createUser() {
            addLog('\n3️⃣ 创建测试用户（带自定义密码）...');
            try {
                const userData = {
                    account: 'testpwd2026final',
                    name: '最终密码测试',
                    email: 'testpwd2026final@test.com',
                    phone: '13800138888',
                    password: 'MyCustom@Pass999', // 自定义密码
                    roleIds: [2],
                    enable: true
                };

                addLog('   📝 用户数据: ' + JSON.stringify(userData, null, 2));

                const res = await fetch(`${API_BASE}/user/create`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-DE-TOKEN': adminToken
                    },
                    body: JSON.stringify(userData)
                });

                const data = await res.json();
                if (data.code === 0 || !data.code) {
                    addLog('   ✅ 用户创建成功!');
                    addLog('   👤 用户ID: ' + (data.data || '未知'));
                    return true;
                }
                addLog('   ❌ 创建失败: ' + JSON.stringify(data));
                return false;
            } catch (error) {
                addLog('   ❌ 错误: ' + error.message);
                return false;
            }
        }

        // 测试新用户登录
        async function testUserLogin() {
            addLog('\n4️⃣ 测试新用户登录（使用自定义密码）...');
            try {
                const publicKey = await getPublicKey();
                const encryptedName = encrypt('testpwd2026final', publicKey);
                const encryptedPwd = encrypt('MyCustom@Pass999', publicKey);

                const res = await fetch(`${API_BASE}/login/localLogin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: encryptedName, pwd: encryptedPwd })
                });

                const data = await res.json();
                if (data.code === 0 && data.data) {
                    addLog('   ✅ 新用户登录成功!');
                    addLog('   🔑 Token: ' + data.data.substring(0, 60) + '...');
                    addLog('\n   ╔════════════════════════════╗');
                    addLog('   ║  ✅ 密码功能测试通过! ║');
                    addLog('   ╚════════════════════════════╝');
                    return true;
                }
                addLog('   ❌ 登录失败: ' + JSON.stringify(data));
                return false;
            } catch (error) {
                addLog('   ❌ 错误: ' + error.message);
                return false;
            }
        }

        // 测试错误密码
        async function testWrongPassword() {
            addLog('\n5️⃣ 测试错误密码（应该拒绝）...');
            try {
                const publicKey = await getPublicKey();
                const encryptedName = encrypt('testpwd2026final', publicKey);
                const encryptedPwd = encrypt('WrongPassword123', publicKey);

                const res = await fetch(`${API_BASE}/login/localLogin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: encryptedName, pwd: encryptedPwd })
                });

                const data = await res.json();
                if (data.code !== 0) {
                    addLog('   ✅ 错误密码被正确拒绝');
                    addLog('   ⚠️  错误信息: ' + (data.msg || '密码错误'));
                    return true;
                }
                addLog('   ❌ 错误密码不应该登录成功!');
                return false;
            } catch (error) {
                addLog('   ❌ 错误: ' + error.message);
                return false;
            }
        }

        // 执行测试
        async function runAllTests() {
            addLog('╔════════════════════════════════════════╗');
            addLog('║     密码功能完整自动化测试            ║');
            addLog('╚════════════════════════════════════════╝\n');

            const loginSuccess = await adminLogin();
            if (!loginSuccess) {
                addLog('\n⛔ Admin登录失败，测试终止');
                return;
            }

            await new Promise(r => setTimeout(r, 1000));

            const userCreated = await createUser();
            if (!userCreated) {
                addLog('\n⛔ 用户创建失败，测试终止');
                return;
            }

            await new Promise(r => setTimeout(r, 2000));

            await testUserLogin();
            await testWrongPassword();

            addLog('\n╔════════════════════════════════════════╗');
            addLog('║          所有测试完成                  ║');
            addLog('╚════════════════════════════════════════╝');
        }

        // 自动执行
        setTimeout(runAllTests, 500);
    </script>
</body>
</html>
